name: comic_vault
description: Premium personal comic book library
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # For dynamic theming based on comic cover colors
  palette_generator: ^0.3.0
  
  # Barcode scanning
  mobile_scanner: ^6.0.0

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Networking & images
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.3.2

  # App info & sharing
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
