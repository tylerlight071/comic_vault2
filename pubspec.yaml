name: comic_vault
description: Premium personal comic book library
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # For dynamic theming based on comic cover colors
  palette_generator: ^0.3.0
  
  # Barcode scanning
  mobile_scanner: ^6.0.0

  # Local database — SQLCipher provides AES-256 full-database encryption
  sqflite_sqlcipher: ^3.3.0
  path: ^1.9.0

  # Networking & images
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # Biometric / device-credential authentication
  local_auth: ^2.3.0

  # App info & sharing
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # File picker (for JSON import)
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
